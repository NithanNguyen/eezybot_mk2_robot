; EEZYbotARM Mk2 - tay may phan loai mau nap chai (CE212)
; Board: NodeMCU-32S (ID "nodemcu-32s" theo tai lieu PlatformIO)
;
; Moi env build mot chuong trinh trong src/<ten_env>/:
;   pio run -e robot -t upload          firmware chinh (mac dinh): phan loai mau + console hieu chuan
;   pio run -e servo_center -t upload   phat 1500 us cho 4 servo truoc khi lap horn

[platformio]
default_envs = robot

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -Wall

[env:robot]
build_src_filter = +<robot/>
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4

[env:servo_center]
build_src_filter = +<servo_center/>
