; EEZYbotARM Mk2 - tay may phan loai mau nap chai (CE212)
; Board: ESP32-DevKitC-32D (module ESP32-WROOM-32D)
; PlatformIO khong co ID chinh thuc cho DevKitC dong ESP32 nen dung esp32dev
; (Espressif ESP32 Dev Module: ESP32 240 MHz, flash 4 MB DIO, variant "esp32").
; Khac nodemcu-32s duy nhat o macro ARDUINO_ESP32_DEV va khong co LED_BUILTIN/KEY_BUILTIN.
;
;   pio run -e robot -t upload          firmware chinh (mac dinh), PHAT XUNG servo (docs/chay_lan_dau.md)
;   pio run -e robot_dry -t upload      firmware chinh chay kho, khong phat xung
;   pio run -e servo_center -t upload   phat 1500 us cho 4 servo truoc khi lap horn
;   pio run -e calib -t upload          hieu chuan servo (docs/hieu_chuan_servo.md)
;   pio run -e servo_test -t upload     kiem tra 1 servo va duong tin hieu (docs/kiem_tra_sg90.md)

[platformio]
default_envs = robot

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -Wall

[env:robot]
build_src_filter = +<robot/>
; phat xung servo theo hieu chuan that (src/robot/arm.h)
build_flags = -Wall -DARM_OUTPUT_ENABLED=1

[env:robot_dry]
; nhu robot nhung CHAY KHO: tinh goc lenh, khong phat xung (dung cho test_motion_parity.py --port)
build_src_filter = +<robot/>
build_flags = -Wall -DARM_OUTPUT_ENABLED=0

[env:servo_center]
build_src_filter = +<servo_center/>

[env:calib]
build_src_filter = +<calib/>

[env:servo_test]
build_src_filter = +<servo_test/>
