; EEZYbotARM Mk2 - tay may phan loai mau nap chai (CE212)
; Board: ESP32-DevKitC-32D (module ESP32-WROOM-32D)
; PlatformIO khong co ID chinh thuc cho DevKitC dong ESP32 nen dung esp32dev
; (Espressif ESP32 Dev Module: ESP32 240 MHz, flash 4 MB DIO, variant "esp32").
; Khac nodemcu-32s duy nhat o macro ARDUINO_ESP32_DEV va khong co LED_BUILTIN/KEY_BUILTIN.
;
;   pio run -e robot -t upload          firmware chinh (mac dinh)
;   pio run -e servo_center -t upload   phat 1500 us cho 4 servo truoc khi lap horn
;   pio run -e calib -t upload          hieu chuan servo (docs/hieu_chuan_servo.md)

[platformio]
default_envs = robot

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -Wall

[env:robot]
build_src_filter = +<robot/>

[env:servo_center]
build_src_filter = +<servo_center/>

[env:calib]
build_src_filter = +<calib/>
